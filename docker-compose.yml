services:
  mysql:
    image: mysql:8.0
    container_name: commerce-mysql
    ports:
      - '${DB_PORT:-3307}:3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'true'
    volumes:
      - commerce_mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: commerce-rabbitmq
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-commerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commerce}
    volumes:
      - commerce_rabbitmq_data:/var/lib/rabbitmq

volumes:
  commerce_mysql_data:
  commerce_rabbitmq_data:
